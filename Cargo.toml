[package]
name = "vice"
version = "0.2.0"
edition = "2021"
default-run = "vice"

[features]
default = ["core"]
core = []
desktop = [
    "dep:ab_glyph",
    "dep:bytemuck",
    "dep:image",
    "dep:pollster",
    "dep:wgpu",
    "dep:wgpu_glyph",
    "dep:winit",
]
installer-ui = ["dep:directories", "dep:eframe", "dep:egui_extras"]
audio = ["dep:rodio"]

[dependencies]
once_cell = "1.21.0"
serde_json = "1.0.150"
libloading = "0.8"
ureq = { version = "2.10", default-features = false, features = ["tls", "json"] }
ring = "0.17"
base64 = "0.22"
regex = "1.11"
rusqlite = { version = "0.32", features = ["bundled"] }
ab_glyph = { version = "0.2.32", optional = true }
bytemuck = { version = "1.25.0", features = ["derive"], optional = true }
directories = { version = "6.0.0", optional = true }
eframe = { version = "0.34.3", optional = true }
egui_extras = { version = "0.34.3", optional = true }
image = { version = "0.25.10", optional = true }
pollster = { version = "0.4.0", optional = true }
rodio = { version = "0.22.2", optional = true }
wgpu = { version = "28.0.0", optional = true }
wgpu_glyph = { version = "0.28.0", optional = true }
winit = { version = "0.30.12", optional = true }

[[bin]]
name = "vice"
path = "src/main.rs"

[[bin]]
name = "vice-installer"
path = "src/bin/vice-installer.rs"
test = false
required-features = ["installer-ui"]

[[bin]]
name = "vicetool"
path = "src/bin/vicetool.rs"


[build-dependencies]
winres = "0.1.12"
