<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#02040a" />
      <stop offset="100%" stop-color="#0b1638" />
    </linearGradient>

    <linearGradient id="trailGradient" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="60%" stop-color="#4facfe" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="1" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="256" height="256" fill="url(#bgGradient)" rx="32" />

  <circle cx="50" cy="60" r="1.5" fill="#ffffff" opacity="0.6" />
  <circle cx="210" cy="180" r="1" fill="#ffffff" opacity="0.4" />
  <circle cx="40" cy="160" r="2" fill="#ffffff" opacity="0.8" />
  <circle cx="180" cy="50" r="1.5" fill="#ffffff" opacity="0.5" />
  <circle cx="220" cy="110" r="1" fill="#ffffff" opacity="0.3" />

  <polygon points="260,-20 140,105 115,80" fill="url(#trailGradient)" filter="url(#glow)"/>
  <line x1="260" y1="-20" x2="128" y2="100" stroke="#ffffff" stroke-width="3" stroke-opacity="0.9" filter="url(#glow)" />

  <g filter="url(#glow)">
    <path d="M128,50 Q128,100 178,100 Q128,100 128,150 Q128,100 78,100 Q128,100 128,50 Z" fill="#ffffff" />
    <path d="M128,70 Q128,100 158,100 Q128,100 128,130 Q128,100 98,100 Q128,100 128,70 Z" fill="#e0f7ff" />
  </g>

  <text x="128" y="215" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="8">VICE</text>

  <text x="128" y="215" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="900" fill="none" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.8" text-anchor="middle" letter-spacing="8" filter="url(#glow)" style="transform: translateY(2px);">VICE</text>
</svg>
